name: Dependabot Auto-merge

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  auto-merge:
    # Only run for pushes Dependabot made. A commit someone else adds to a
    # Dependabot PR skips this job, and the repo's "dismiss stale approvals"
    # rule clears any earlier approval.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0

      # Auto-merge package updates (npm/yarn, pip, uv) unless they're a major
      # version. Other ecosystems (GitHub Actions, Docker) wait for a person.
      # If Dependabot can't classify an update (common for security fixes that
      # also bump the parent package), the update type is empty, so it counts as
      # eligible and relies on the required checks. Grouped updates report their
      # largest change, so a group with a major still waits.
      - name: Approve and enable auto-merge
        if: >-
          (steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
            || steps.meta.outputs.package-ecosystem == 'pip'
            || steps.meta.outputs.package-ecosystem == 'uv')
          && steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Approve the exact commit Dependabot pushed, and only turn on auto-merge
        # while it's still the head. A later push by someone else relies on the
        # repo's "dismiss stale approvals" rule to stop the merge.
        run: |
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f commit_id="$HEAD_SHA" -f event=APPROVE
          gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR" --repo "$REPO"
